# Dependabot configuration

version: 2

registries:
  npm-npmjs:
    type: npm-registry
    url: https://registry.npmjs.org
    replaces-base: true

updates:
  # npm dependencies (root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Held for dedicated migration PRs (split out of the tar/undici security PR)
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mariozechner/pi-coding-agent"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # sharp 0.35 breaks image-ops typings and pulls libvips LGPL-3.0-or-later (fails Dependency Review)
      - dependency-name: sharp
        update-types: ["version-update:semver-minor"]
    open-pull-requests-limit: 10
    registries:
      - npm-npmjs

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
